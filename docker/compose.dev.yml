# Full development stack: metadata DB, queue, API, worker, web, and a seeded
# fixture database standing in for a customer system.
#
#   docker compose -f docker/compose.dev.yml up --build
#
# Secrets come from apps/api/.env, which is gitignored. Never inline them here.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agah
      POSTGRES_PASSWORD: agah
      POSTGRES_DB: agah
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agah"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  fixture-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: hr
    ports: ["5433:5432"]
    volumes:
      - ../apps/api/tests/fixtures/hr_schema.sql:/docker-entrypoint-initdb.d/01.sql:ro

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../apps/api/.env
    environment:
      AGAH_DATABASE_URL: postgresql+asyncpg://agah:agah@postgres:5432/agah
      AGAH_REDIS_URL: redis://redis:6379/0
      AGAH_ADMIN_EMAIL: ${AGAH_ADMIN_EMAIL:-admin@agah.local}
      AGAH_ADMIN_PASSWORD: ${AGAH_ADMIN_PASSWORD:?set AGAH_ADMIN_PASSWORD before starting}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head
      && python -m agah.cli seed-admin
      && uvicorn agah.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../apps/api/.env
    environment:
      AGAH_DATABASE_URL: postgresql+asyncpg://agah:agah@postgres:5432/agah
      AGAH_REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_started}
    command: arq agah.pipeline.worker.WorkerSettings

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api: {condition: service_started}
    ports: ["3000:3000"]
