# /root/nginx_config/conf.d/jamasp.conf
#
# Everything goes to one upstream: the Next.js container. It proxies /api/*
# onward to the API container itself, over the internal compose network. That
# keeps the session cookie first-party — it is httpOnly and SameSite=Lax, so a
# cross-origin call would silently drop it.
#
# Change 9210 if you picked a different JAMASP_WEB_PORT.

server {
    listen 443 ssl;
    http2 on;

    server_name jamasp.geotajak.ir;

    include /etc/nginx/conf.d/includes/ssl-geotajak.conf;

    add_header Content-Security-Policy "frame-ancestors *" always;

    # Schemas and pasted OpenAPI documents can be large.
    client_max_body_size 50M;

    # Server-sent events: scan and report progress.
    #
    # These connections stay open for minutes and must not be buffered — with
    # buffering on, nginx holds the events and the progress bar sits frozen until
    # the whole job finishes, which is exactly what the streaming is there to
    # avoid.
    location ~ ^/api/(scans|reports)/[^/]+/events$ {
        proxy_pass http://185.53.142.74:9210;

        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # API. A scan of a large database, or a report that makes several model
    # calls, can run well past the default 60s.
    location /api/ {
        proxy_pass http://185.53.142.74:9210;

        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Frontend.
    location / {
        proxy_pass http://185.53.142.74:9210;

        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
